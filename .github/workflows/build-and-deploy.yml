name: deploy to gh-pages

# NOTE: the new UI (feature/new-ui) is deployed for now – master does NOT deploy
# until the new UI is merged. Switch the branch back to 'master' afterwards.
on:
  push:
    branches:
      - 'feature/new-ui'
    paths:
      - 'client/**'
      - '.github/**'

  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build ⚙
    runs-on: ubuntu-latest
    # manual runs are only allowed from the new UI branch as well
    if: github.ref == 'refs/heads/feature/new-ui'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
      - name: Archive build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: client/dist
  deploy:
    name: Deploy 🚀
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ordersystem
